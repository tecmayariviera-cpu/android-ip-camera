name: Build APK

# Builds an installable debug APK in the cloud on every push, so no local Android Studio is needed.
# The APK is attached to a pre-release named after the branch (download it straight from the
# phone) and also kept as a workflow artifact.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests and build debug APK
        run: ./gradlew test :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(ls app/build/outputs/apk/debug/*.apk | grep -m1 universal || ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" out/webcam-pro-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: webcam-pro-debug-apk
          path: out/webcam-pro-debug.apk
          retention-days: 30

      - name: Publish pre-release for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          tag="apk-${branch}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/webcam-pro-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de prueba (${GITHUB_REF_NAME})" \
            --notes "Compilado del commit ${GITHUB_SHA::7}. Descarga webcam-pro-debug.apk e instálalo en el teléfono."
